<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0ea5e9" />

    <!-- From realfavicongenerator.net -->
    <link rel="apple-touch-icon" sizes="180x180" href="%PUBLIC_URL%/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="%PUBLIC_URL%/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="%PUBLIC_URL%/favicon-16x16.png">
    <link rel="manifest" href="%PUBLIC_URL%/site.webmanifest">
    <link rel="mask-icon" href="%PUBLIC_URL%/safari-pinned-tab.svg" color="#5bbad5">
    <meta name="msapplication-TileColor" content="#00aba9">
    <meta name="theme-color" content="#0ea5e9">

    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->

    <meta
      name="description"
      content="UP Resilience Institute - Citizen Science Seismic Network"
    />
    <!-- Performance: load Leaflet CSS without blocking first paint -->
    <!--
      Lighthouse: Render‑blocking CSS. Use preload + onload swap to keep
      initial render fast, but still ensure Leaflet styles are ready by the
      time the map mounts. A <noscript> fallback preserves behavior with JS off.
    -->
    <link
      rel="preload"
      as="style"
      href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css"
      integrity="sha512-xodZBNTC5n17Xt2atTPuE1HxjVMSvLVW9ocqUKLsCC5CXdbqCmblAshOMAS6/keqq/sMZMZ19scR4PsZChSR7A=="
      crossorigin
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css"
        integrity="sha512-xodZBNTC5n17Xt2atTPuE1HxjVMSvLVW9ocqUKLsCC5CXdbqCmblAshOMAS6/keqq/sMZMZ19scR4PsZChSR7A=="
        crossorigin
      />
    </noscript>

    <!-- Performance: connection hints for common basemap providers -->
    <!-- Keep preconnects <= 4 to avoid Lighthouse warning about excessive preconnects. -->
    <!-- We prioritize OSM (default) and a single Carto domain; ArcGIS will establish on-demand. -->
    <!-- TODO(perf): If a single provider becomes the default, remove the others. -->
    <link rel="dns-prefetch" href="//a.tile.openstreetmap.org" />
    <link rel="dns-prefetch" href="//b.tile.openstreetmap.org" />
    <link rel="preconnect" href="https://a.tile.openstreetmap.org" crossorigin />
    <link rel="preconnect" href="https://b.tile.openstreetmap.org" crossorigin />
    <link rel="dns-prefetch" href="//a.basemaps.cartocdn.com" />
    <link rel="preconnect" href="https://a.basemaps.cartocdn.com" crossorigin />
    <title>Latest Earthquakes</title>
    <!-- Runtime env config: keep non-deferred so dev WDS bundles (non-deferred) see it before execution. -->
    <script type="text/javascript" src="%PUBLIC_URL%/config.js"></script>
    <!-- Google Analytics (GA4) with Consent Mode v2; loads only when GA IDs are present -->
    <script>
      (function () {
        try {
          window.dataLayer = window.dataLayer || [];
          function gtag(){dataLayer.push(arguments);} // eslint-disable-line no-inner-declarations
          window.gtag = gtag;

          // Default consent: deny analytics until user accepts
          gtag('consent', 'default', {
            ad_storage: 'denied',
            analytics_storage: 'denied',
            functionality_storage: 'granted',
            security_storage: 'granted',
            wait_for_update: 500
          });

          // Choose measurement ID based on environment similar to backend host selection
          var env = (window.ENV || {});
          var midProd = env.REACT_APP_GA_MEASUREMENT_ID || '';
          var midDev = env.REACT_APP_GA_MEASUREMENT_ID_DEV || '';
          var host = (location.hostname || '').toLowerCase();
          var isProdDomain = host === 'earthquake.science.upd.edu.ph';
          var mid = isProdDomain ? midProd : (midDev || midProd);

          if (mid) {
            gtag('js', new Date());
            gtag('config', mid);
            var s = document.createElement('script');
            s.async = true; s.src = 'https://www.googletagmanager.com/gtag/js?id=' + mid;
            document.head.appendChild(s);
          }

          // Simple global accept function; wire this to your consent banner if needed
          window.acceptAnalytics = function() {
            try { gtag('consent', 'update', { analytics_storage: 'granted' }); } catch (e) {}
          };

          // If user previously granted consent, restore it immediately
          try {
            if (window.localStorage && window.localStorage.getItem('ehub_ga_consent') === 'granted') {
              gtag('consent', 'update', { analytics_storage: 'granted' });
            }
          } catch (e) {}
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>

      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

  </body>
</html>
