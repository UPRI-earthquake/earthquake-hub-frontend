server {
  listen 3000;

  # Enable gzip compression for text-based assets to reduce TTFB/transfer time
  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_vary on;
  gzip_types
    text/plain text/css text/javascript application/javascript application/x-javascript
    application/json application/manifest+json application/xml application/rss+xml
    image/svg+xml;

  # Serve the built CRA app
  location / {
    root /usr/share/nginx/html;
    index index.html index.htm;
    try_files $uri $uri/ /index.html =404;

    # Do not cache the HTML shell so deployments are picked up immediately
    if ($uri = "/index.html") { add_header Cache-Control "no-cache, no-store, must-revalidate" always; }
  }

  # Runtime env file should never be cached aggressively
  location = /config.js {
    root /usr/share/nginx/html;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
  }

  # Long cache lifetimes for hashed static assets generated by CRA
  location /static/ {
    root /usr/share/nginx/html;
    access_log off;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  # Cache common asset extensions served from /usr/share/nginx/html
  location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|webp|woff2?)$ {
    root /usr/share/nginx/html;
    access_log off;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000" always;
  }
}
