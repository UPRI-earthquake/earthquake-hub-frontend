
services:
  frontend:
    build:
      context: .
      args:
        VITE_APP_ENV: ${VITE_APP_ENV}
        VITE_APP_BACKEND: ${VITE_APP_BACKEND}
        VITE_APP_RINGSERVER_WS: ${VITE_APP_RINGSERVER_WS}
        VITE_APP_FDSNWS: ${VITE_APP_FDSNWS}
        VITE_APP_RS_FDSNWS: ${VITE_APP_RS_FDSNWS}
        VITE_APP_PUBLIC_VAPID_KEY: ${VITE_APP_PUBLIC_VAPID_KEY}
      dockerfile: Dockerfile
    image: ${IMAGE_NAME:-ghcr.io/upri-earthquake/earthquake-hub-frontend:latest}
